name: Deploy Rota Hesaplayıcı to GitHub Pages

on:
  push:
    branches:
      - main # Veya projenizin ana dalı (master, gh-pages vb.)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Kullandığınız Node.js versiyonunu buraya yazın

    - name: Install Dependencies
      # package.json'u direkt kök dizinde bulacağı için ek bir 'cd' komutuna gerek yok.
      run: npm install

    - name: Inject API Key into HTML
      # replace-api-key.js de kök dizinde olduğu için ek bir 'cd' komutuna gerek yok.
      run: node replace-api-key.js
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ # Kök dizini yayınla

name: Deploy Rota Hesaplayıcı to GitHub Pages

on:
  push:
    branches:
      - main # Veya projenizin ana dalı (master, gh-pages vb.)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Kullandığınız Node.js versiyonunu buraya yazın

    - name: Install Dependencies
      run: npm install # Eğer projenizde başka bağımlılıklar varsa (sadece fs değil)

    - name: Inject API Key into HTML
      run: node replace-api-key.js
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }} # GitHub Secret'ı buraya enjekte ediyoruz

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ # HTML dosyanızın bulunduğu dizin (muhtemelen projenizin kök dizini)
        # Eğer HTML dosyanız başka bir alt dizinde ise, örneğin 'public' veya 'dist', o dizini buraya yazın:
        # publish_dir: ./public

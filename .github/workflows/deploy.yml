name: Deploy Rota Hesaplayici to GitHub Pages

on:
  push:
    branches:
      - main # Veya sitenizi yayınladığınız branch'in adı (örn. master, gh-pages)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4 # Node.js ortamını kurar
      with:
        node-version: '18' # Kullanmak istediğiniz Node.js versiyonu

    - name: Replace API Key in HTML using Node.js script
      env:
        # GitHub Secret'ı bir ortam değişkeni olarak Node.js betiğine aktarır
        MAPS_API_KEY: ${{ secrets.Maps_API_KEY }} 
      run: |
        # Node.js betiğini çalıştır
        node replace-api-key.js

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ # rota-hesaplayici.html kök dizinde olduğu için bu doğru

name: Deploy Rota Hesaplayici to GitHub Pages

on:
  push:
    branches:
      - main # Veya sitenizi yayınladığınız branch'in adı (örn. master, gh-pages)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Replace API Key in HTML
      run: |
        # API anahtarını GitHub Secrets'tan al
        # Not: secrets.Maps_API_KEY olarak adlandırılan secret'ı kullanıyoruz.
        # GitHub deponuzun Settings > Secrets and variables > Actions bölümünde bu secret'ın tanımlı olduğundan emin olun.
        API_KEY="${{ secrets.MAPS_API_KEY }}"
        
        # HTML dosyasını oku ve 'key=' parametresi içindeki yer tutucuyu gerçek API anahtarıyla değiştir.
        # Bu, API anahtarının doğru yere enjekte edilmesini sağlar.
        sed -i "s|key=YOUR_Maps_API_KEY_PLACEHOLDER|key=${API_KEY}|g" rota-hesaplayici.html

        # Değişiklikleri görmek isterseniz (opsiyonel)
        # cat rota-hesaplayici.html
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ # HTML dosyanızın bulunduğu dizin (muhtemelen depo kökü)
        # Eğer HTML dosyanız başka bir alt klasördeyse, örneğin 'dist'
        # publish_dir: ./dist

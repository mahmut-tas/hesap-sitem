name: Generate and Update Sitemap

on:
  push:
    branches:
      - main # Veya sitenizin deploy edildiği dalın adı (örneğin: master, gh-pages)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Generate sitemap
        id: generate_sitemap
        run: |
          # Sitemap oluşturma betiği
          python -c "
import os
from glob import glob
from datetime import datetime
from bs4 import BeautifulSoup

base_url = 'https://hesapkolik.net' # Kendi site URL'nizi buraya yazın!
output_file = 'sitemap.xml'
html_files_path = './**/*.html' # Sitenizdeki HTML dosyalarının yolunu belirtin

urls = []
for file_path in glob(html_files_path, recursive=True):
    # Eğer dosya GitHub Actions cache veya benzeri bir dizindeyse atla
    if 'node_modules' in file_path or '.git' in file_path or '.github' in file_path:
        continue

    # GitHub Pages'in kök dizinini doğru şekilde hesaplayın
    # Örneğin, 'index.html' -> 'https://hesapkolik.net/'
    # 'about/index.html' -> 'https://hesapkolik.net/about/'
    # 'blog/post.html' -> 'https://hesapkolik.net/blog/post.html'
    relative_path = os.path.relpath(file_path, '.')
    
    # Eğer dosya index.html ise ve bir dizinin içindeyse
    if relative_path.endswith('index.html') and '/' in relative_path:
        path_segments = relative_path.split('/')
        # Son segment index.html ise onu çıkar ve sonunda bir '/' bırak
        if path_segments[-1] == 'index.html':
            url_path = '/'.join(path_segments[:-1]) + '/'
        else:
            url_path = relative_path # Olmaz ama yine de
    elif relative_path == 'index.html': # Ana dizin index.html
        url_path = '/'
    else:
        url_path = '/' + relative_path # Diğer tüm .html dosyaları

    full_url = base_url.rstrip('/') + url_path
    
    # HTML içeriğinden son değişiklik tarihini veya önceliği çekmek isterseniz
    # with open(file_path, 'r', encoding='utf-8') as f:
    #     soup = BeautifulSoup(f.read(), 'html.parser')
    #     # Örneğin, bir <meta name="last-modified"> etiketinden tarih çekme
    #     # lastmod_tag = soup.find('meta', {'name': 'last-modified'})
    #     # lastmod = lastmod_tag['content'] if lastmod_tag and 'content' in lastmod_tag.attrs else datetime.now().isoformat()
    lastmod = datetime.now().isoformat() # Basitçe şimdiki zamanı kullanıyoruz

    urls.append({
        'loc': full_url,
        'lastmod': lastmod,
        'changefreq': 'weekly', # İçeriğin ne sıklıkla değiştiği (always, hourly, daily, weekly, monthly, yearly, never)
        'priority': '0.8' # Bu URL'nin diğerlerine göre önemi (0.0 - 1.0)
    })

# Sitemap XML'ini oluştur
sitemap_content = '''<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
'''
for url_data in urls:
    sitemap_content += f'''  <url>
    <loc>{url_data['loc']}</loc>
    <lastmod>{url_data['lastmod']}</lastmod>
    <changefreq>{url_data['changefreq']}</changefreq>
    <priority>{url_data['priority']}</priority>
  </url>
'''
sitemap_content += '</urlset>'

with open(output_file, 'w', encoding='utf-8') as f:
    f.write(sitemap_content)

print(f'Sitemap generated at {output_file}')
" > sitemap_generation.log 2>&1

      - name: Check for changes
        id: git_status
        run: |
          git diff --exit-code sitemap.xml || echo "::set-output name=has_changes::true"

      - name: Commit and push sitemap if changed
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "🤖 Update sitemap.xml"
          git push

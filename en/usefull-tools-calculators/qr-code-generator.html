 <body>
  <div id="header-placeholder">
  </div>
  <main>
    <section class="hero-section">
      <div class="container">
        <h1>
          QR Code Generator
        </h1>
        <p>
          Convert your text, URLs, or any information into a QR code instantly.
        </p>
      </div>
    </section>

    <section class="calculator-selection-section">
      <div class="container">
        <div class="calc-wrapper" id="qr-generator-wrapper">
          <h3>
            <i class="fas fa-qrcode icon-small">
            </i>
            Generate QR Code
          </h3>
          <div class="calculator-form-container">
            <div class="input-group">
              <label for="qrTextInput">
                Text / URL to Convert to QR Code:
              </label>
              <textarea id="qrTextInput" rows="5" placeholder="Enter the text or URL you want to convert to a QR code here..."></textarea>
            </div>
            <button id="generateQrBtn">
              Generate QR Code
            </button>
            <div class="qr-code-display" id="qrcode">
              </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-placeholder">
  </div>

  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const isEnglishPage = window.location.pathname.startsWith('/en/');
      const headerPath = isEnglishPage ? '/en/header.html' : '/header.html';
      const footerPath = isEnglishPage ? '/en/footer.html' : '/footer.html';

      // Load Header
      fetch(headerPath)
          .then(response => {
              if (!response.ok) {
                  throw new Error('Header network response was not ok: ' + response.statusText + ' from ' + headerPath);
              }
              return response.text();
          })
          .then(data => {
              const headerPlaceholder = document.getElementById('header-placeholder');
              if (headerPlaceholder) {
                  headerPlaceholder.innerHTML = data;

                  // Find and execute script within the loaded header HTML
                  const scriptElement = headerPlaceholder.querySelector('script');
                  if (scriptElement) {
                      const newScript = document.createElement('script');
                      newScript.textContent = scriptElement.textContent;
                      document.body.appendChild(newScript);
                      scriptElement.remove();
                  }
              }
          })
          .catch(error => console.error('Error loading header:', error));

      // Load Footer
      fetch(footerPath)
          .then(response => {
              if (!response.ok) {
                  throw new Error('Footer network response was not ok: ' + response.statusText + ' from ' + footerPath);
              }
              return response.text();
          })
          .then(data => {
              const footerPlaceholder = document.getElementById('footer-placeholder');
              if (footerPlaceholder) {
                  footerPlaceholder.innerHTML = data;
                  const tempDiv = document.createElement('div');
                  tempDiv.innerHTML = data;
                  const footerElement = tempDiv.querySelector('footer');
                  if (footerElement) {
                      footerPlaceholder.replaceWith(footerElement);
                  }
              }
          })
          .catch(error => console.error('Error loading footer:', error));
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const qrTextInput = document.getElementById('qrTextInput');
        const generateQrBtn = document.getElementById('generateQrBtn');
        const qrcodeContainer = document.getElementById('qrcode');

        // Function to generate the QR code
        function generateQRCode() {
            const text = qrTextInput.value.trim(); // Get input text and trim whitespace

            // Clear previous QR code
            qrcodeContainer.innerHTML = '';

            if (text === '') {
                qrcodeContainer.innerHTML = '<p class="error">Please enter text or a URL to convert to a QR code.</p>';
                return;
            }

            // Generate QR code using QRCode.js library
            new QRCode(qrcodeContainer, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // Listen for button click event
        generateQrBtn.addEventListener('click', generateQRCode);

        // (Optional) Generate QR code when Enter key is pressed in the text area
        qrTextInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent default Enter behavior (new line)
                generateQRCode();
            }
        });
    });
  </script>

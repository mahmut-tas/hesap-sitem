<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hesapkolik Blog - Tüm Hesaplama İhtiyaçlarınız İçin Makaleler</title>
    <meta content="Hesapkolik blogunda sağlık, finans, mühendislik ve günlük hayat konularında faydalı makaleler, ipuçları ve detaylı rehberler bulabilirsiniz." name="description"/>
    <meta content="hesaplama, blog, makale, rehber, ipuçları, finans, sağlık, mühendislik, günlük hayat" name="keywords"/>
    <link href="/css/header.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/css/footer.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2eExNlV/KFNB6sY/3gHYcZLKXFwBqj1+f1oK3w1K/pPq6f2X5f5F5F5F5F5==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
    <script async="" crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4485100647313206"></script>
    <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-3655KNY8CP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3655KNY8CP');
    </script>
    <style>
      /* Ana sayfadaki blog-post-grid ve blog-post-card stillerini buraya kopyalayabilirsiniz */
      /* Eğer style.css dosyasına eklediyseniz buraya tekrar eklemenize gerek yok */

      /* Örnek olarak, ana sayfadaki .calculator-grid ve .calculator-card stillerinin benzerlerini buraya koydum */
      .blog-post-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 30px;
          justify-content: center;
          align-items: stretch;
          padding-top: 50px;
          padding-bottom: 50px;
      }

      .blog-post-card {
          background-color: #ffffff;
          border-radius: 10px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
          padding: 25px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          transition: transform 0.3s ease, box-shadow 0.3s ease;
          min-height: 250px;
      }

      .blog-post-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      .blog-post-card img {
          width: 80px;
          height: 80px;
          margin-bottom: 15px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid #ddd;
      }

      /* YENİ EKLENDİ: İkonlar için stil */
      .blog-post-card .blog-icon-container {
          width: 80px;
          height: 80px;
          margin-bottom: 15px;
          border-radius: 50%;
          background-color: #f9f9f9; /* Hafif bir arka plan */
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 3em; /* İkonun boyutunu ayarla */
          color: #3498db; /* İkonun rengini ayarla */
          border: 2px solid #ddd;
      }

      .blog-post-card h3 {
          font-size: 1.5em;
          color: #2c3e50;
          margin-bottom: 10px;
          flex-grow: 1;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .blog-post-card p {
          font-size: 0.9em;
          color: #666;
          margin-bottom: 20px;
          flex-grow: 1;
      }

      .blog-post-card .card-button {
          display: inline-block;
          background-color: #3498db;
          color: white;
          padding: 10px 20px;
          border-radius: 5px;
          text-decoration: none;
          font-weight: 600;
          transition: background-color 0.3s ease, transform 0.2s ease;
          width: 80%;
          max-width: 200px;
      }

      .blog-post-card .card-button:hover {
          background-color: #2980b9;
          transform: translateY(-2px);
      }

      /* Sayfalama (Pagination) Stilleri */
      .pagination {
          display: flex;
          justify-content: center;
          padding: 30px 0;
          list-style: none;
          margin-top: 20px;
      }

      .pagination li {
          margin: 0 5px;
      }

      .pagination a, .pagination span {
          display: block;
          padding: 10px 15px;
          text-decoration: none;
          color: #3498db;
          border: 1px solid #ddd;
          border-radius: 5px;
          transition: background-color 0.3s ease, color 0.3s ease;
      }

      .pagination a:hover {
          background-color: #f0f0f0;
      }

      .pagination .active a, .pagination .active span {
          background-color: #3498db;
          color: white;
          border-color: #3498db;
          cursor: default;
      }

      .pagination .disabled a, .pagination .disabled span {
          color: #ccc;
          cursor: not-allowed;
          background-color: #f9f9f9;
          border-color: #eee;
      }

      /* Responsive Ayarlamalar */
      @media (max-width: 768px) {
          .blog-post-grid {
              grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          }
          .blog-post-card {
              min-height: auto;
          }
      }
      @media (max-width: 480px) {
          .blog-post-card h3 {
              font-size: 1.3em;
          }
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="hero" style="background-color: #8e44ad;">
        <div class="container">
          <h2>Hesapkolik Blog</h2>
          <p>Sağlık, finans, mühendislik ve günlük hayatla ilgili bilmeniz gereken her şey burada. Pratik bilgiler, rehberler ve ipuçlarıyla hayatınızı kolaylaştırın!</p>
          <a class="cta-button" href="#latest-posts">Son Yazılarımızı Keşfedin</a>
        </div>
      </section>

      <div class="container">
        <h2 id="latest-posts">Tüm Blog Yazıları</h2>
        <div class="blog-post-grid" id="blog-posts-container">
          </div>

        <ul class="pagination" id="pagination-controls">
          </ul>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const isEnglishPage = window.location.pathname.startsWith('/en/');
        const headerPath = isEnglishPage ? '/en/header.html' : '/header.html';
        const footerPath = isEnglishPage ? '/en/footer.html' : '/footer.html';

        // Header Yükleme
        fetch(headerPath)
          .then(response => {
            if (!response.ok) {
              throw new Error('Header network response was not ok: ' + response.statusText + ' from ' + headerPath);
            }
            return response.text();
          })
          .then(data => {
            const headerPlaceholder = document.getElementById('header-placeholder');
            if (headerPlaceholder) {
              headerPlaceholder.innerHTML = data;
              const scriptElement = headerPlaceholder.querySelector('script');
              if (scriptElement) {
                const newScript = document.createElement('script');
                newScript.textContent = scriptElement.textContent;
                document.body.appendChild(newScript);
                scriptElement.remove();
              }
            }
          })
          .catch(error => console.error('Header yüklenirken hata oluştu:', error));

        // Footer Yükleme
        fetch(footerPath)
          .then(response => {
            if (!response.ok) {
              throw new Error('Footer network response was not ok: ' + response.statusText + ' from ' + footerPath);
            }
            return response.text();
          })
          .then(data => {
            const footerPlaceholder = document.getElementById('footer-placeholder');
            if (footerPlaceholder) {
              footerPlaceholder.innerHTML = data;
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = data;
              const footerElement = tempDiv.querySelector('footer');
              if (footerElement) {
                footerPlaceholder.replaceWith(footerElement);
              }
            }
          })
          .catch(error => console.error('Footer yüklenirken hata oluştu:', error));

        // Blog Yazıları Verisi - Revize Edildi
        const blogPosts = [
          { title: 'HbA1c Değerini Anlamak', description: 'Diyabet yönetiminin temel taşı olan HbA1cyi, tanıdaki önemini ve kan şekeri kontrolünüz üzerindeki etkilerini interaktif bir şekilde keşfedin.', icon: '<i class="fa-solid fa-droplet"></i>', url: '/blog/hba1c.html' },
          { title: 'Ozempic ve Metformin Karşılaştırması: Tip 2 Diyabet Yönetimi', description: 'Tip 2 diyabet tedavisinde kullanılan Ozempic (Semaglutide) ve Metformin ilaçlarının etki mekanizmaları, avantajları, yan etkileri ve kullanım alanları detaylı karşılaştırması.', icon: <i class="fa-solid fa-hand-holding-droplet"></i>, url: '/blog/ozempic-metformin-tip2-diyabet.html' },
          { title: 'Vücut Kitle İndeksi (BMI) Rehberi', description: 'Sağlıklı yaşamın önemli bir göstergesi olan BMI"ınızı hesaplayın ve vücut kompozisyonunuzun sağlığınız üzerindeki etkilerini keşfedin.', icon: '<i class="fa-solid fa-child"></i>', url: '/blog/bmi.html' },
          { title: 'Mühendislikte Isı Transferi Temelleri', description: 'Isı transferinin temel prensipleri ve mühendislik uygulamalarındaki rolü.', icon: '<i class="fa-solid fa-temperature-arrow-up"></i>', url: '/blog/isi-transfer.html' },
          { title: 'Ampul Seçimi Rehberi', description: 'Eviniz için en verimli ve en ideal ampulü bularak hem faturalarınızdan tasarruf edin hem de mükemmel atmosferi yaratın.', icon: '<i class="fa-solid fa-lightbulb"></i>', url: '/blog/ampul-secimi.html' },
          { title: 'Google Adsense Geliri Artırma Rehberi', description: ' Daha çok tıklama, daha çok kazanç için ilgi çekici içerikler nasıl yazılır, sıcak konular nasıl tespit edilir ve siteniz nasıl optimize edilir? Hepsi bu rehberde!', icon: <i class="fa-brands fa-google"></i>, url: '/blog/adsense-gelir.html' },
          { title: 'Yeni Başlayanlar İçin Borsa Rehberi', description: 'Yeni Başlayanlar İçin Borsa Rehberi: Hisse Senedi Alım Satımına İlk Adım', icon: <i class="fa-solid fa-money-bill-transfer"></i>, url: '/blog/borsa.html' },
          { title: 'Araç Karşılaştırması: Yakıt ve Maliyetler', description: 'Araç Seçiminde Yeni Bir Dönem: Elektrikli, Dizel, Benzinli ve Hibrit Araçların Kapsamlı Karşılaştırması', icon: <i class="fa-solid fa-charging-station"></i>, url: '/blog/arac.html' },
          { title: 'Artan Gıda Fiyatlarına Karşı Akıllı Alışveriş Taktikleri', description: "Türkiye'de artan gıda enflasyonuna karşı cebinizi korumak için akıllı alışveriş taktikleri ve birikimlerinizi değerlendirme yolları.", icon: <i class="fa-solid fa-money-bill-trend-up"></i>, url: '/blog/enflasyon-korunma-yollari.html' },
          { title: 'Tip 2 Diyabet', description: 'Tip 2 diyabet teşhisi, sağlıklı beslenme ve yaşam tarzı değişiklikleriyle daha uzun, daha kaliteli bir yaşama giden beklenmedik bir yol olabilir. Bu rehber, diyabetin gizli faydalarını ve nasıl proaktif bir sağlık yolculuğuna çıkılacağını açıklıyor.', img: 'https://via.placeholder.com/80/d35400/ffffff?text=KRIPTO', url: '/blog/diyabet-fayda.html' },
          { title: 'Ev Cephesi Önemi, Avantajları, Dezevantajları', description: "Türkiye'de ev alırken veya inşa ederken cephe seçiminin önemi. Güney, Kuzey, Doğu ve Batı cephelerinin enerji verimliliği, aydınlatma, konfor ve maliyetler üzerindeki etkileri.", icon: <i class="fa-solid fa-house-user"></i>, url: '/blog/ev-cephe-secim-rehberi.html' },
          { title: 'Bitki Bakımı İpuçları: Yeni Başlayanlar İçin', description: 'Evde bitki yetiştirmeye başlamak için temel bilgiler ve pratik ipuçları.', img: 'https://via.placeholder.com/80/16a085/ffffff?text=BITKI', url: '/blog/bitki-bakimi.html' },
          { title: 'İş Görüşmesi Hazırlığı: Başarılı Olmanın Sırları', description: 'İş görüşmelerinde kendinizi en iyi şekilde tanıtmak için ipuçları.', img: 'https://via.placeholder.com/80/95a5a6/ffffff?text=IS', url: '/blog/is-gorusmesi.html' },
          { title: 'Minimalist Yaşam Tarzı ve Faydaları', description: 'Daha azla daha çok şeye sahip olma felsefesi ve minimalist yaşamın avantajları.', img: 'https://via.placeholder.com/80/f39c12/ffffff?text=MINIMAL', url: '/blog/minimalist-yasam.html' },
          { title: 'Dijital Pazarlama Stratejileri', description: 'Online görünürlüğünüzü artırmak için etkili dijital pazarlama yöntemleri.', img: 'https://via.placeholder.com/80/e67e22/ffffff?text=PAZARLAMA', url: '/blog/dijital-pazarlama.html' },
          { title: 'Yapay Zeka ve Geleceğimiz', description: 'Yapay zekanın gelişimi, kullanım alanları ve potansiyel etkileri.', img: 'https://via.placeholder.com/80/2c3e50/ffffff?text=AI', url: '/blog/yapay-zeka.html' },
          { title: 'Gönüllü Çalışmanın Faydaları', description: 'Topluma katkıda bulunmanın ve kişisel gelişmenin yolları.', img: 'https://via.placeholder.com/80/f1c40f/ffffff?text=GONULLU', url: '/blog/gonullu-calisma.html' },
          { title: 'Online Eğitim Platformları Rehberi', description: 'Uzaktan eğitim alabileceğiniz en iyi platformlar ve kurslar.', img: 'https://via.placeholder.com/80/3498db/ffffff?text=ONLINE', url: '/blog/online-egitim.html' },
          { title: 'Yaratıcı Yazarlık İpuçları', description: 'Hikaye anlatımı ve metin yazarlığı becerilerinizi geliştirmek için pratik öneriler.', img: 'https://via.placeholder.com/80/e74c3c/ffffff?text=YAZI', url: '/blog/yaratici-yazarlik.html' },
          { title: 'Evcil Hayvan Bakımı İçin Temel Bilgiler', description: 'Sorumlu evcil hayvan sahiplenmenin temel prensipleri ve bakım ipuçları.', img: 'https://via.placeholder.com/80/2ecc71/ffffff?text=EVCIL', url: '/blog/evcil-hayvan-bakimi.html' },
        ];


        const postsPerPage = 10; // Sayfa başına gösterilecek blog yazısı sayısı
        let currentPage = 1;

        const blogPostsContainer = document.getElementById('blog-posts-container');
        const paginationControls = document.getElementById('pagination-controls');

        function displayPosts(page) {
          blogPostsContainer.innerHTML = ''; // Önceki gönderileri temizle
          const startIndex = (page - 1) * postsPerPage;
          const endIndex = startIndex + postsPerPage;
          const postsToDisplay = blogPosts.slice(startIndex, endIndex);

          if (postsToDisplay.length === 0) {
            blogPostsContainer.innerHTML = '<p style="text-align: center; color: #666; font-size: 1.1em; padding: 50px;">Henüz gösterilecek blog yazısı bulunmamaktadır.</p>';
            return;
          }

          postsToDisplay.forEach(post => {
            const card = document.createElement('div');
            card.classList.add('blog-post-card');

            let mediaContent = '';
            // Eğer post.img tanımlıysa, resim kullan
            if (post.img) {
              mediaContent = `<img alt="${post.title} İkonu" src="${post.img}"/>`;
            }
            // Eğer post.icon tanımlıysa, ikon kullan
            else if (post.icon) {
              mediaContent = `<div class="blog-icon-container">${post.icon}</div>`;
            }
            // Ne img ne de icon varsa varsayılan bir yer tutucu kullan (isteğe bağlı)
            else {
                mediaContent = `<img alt="Varsayılan Resim" src="https://via.placeholder.com/80/cccccc/ffffff?text=Blog"/>`;
            }

            card.innerHTML = `
              ${mediaContent}
              <h3>${post.title}</h3>
              <p>${post.description}</p>
              <a class="card-button" href="${post.url}">Devamını Oku</a>
            `;
            blogPostsContainer.appendChild(card);
          });
        }

        function setupPagination(totalPages) {
          paginationControls.innerHTML = ''; // Önceki sayfalama kontrollerini temizle

          const prevLink = document.createElement('li');
          prevLink.classList.add('page-item');
          if (currentPage === 1) {
            prevLink.classList.add('disabled');
          }
          prevLink.innerHTML = `<a href="#" data-page="${currentPage - 1}">&laquo; Önceki</a>`;
          paginationControls.appendChild(prevLink);

          for (let i = 1; i <= totalPages; i++) {
            const pageLink = document.createElement('li');
            pageLink.classList.add('page-item');
            if (i === currentPage) {
              pageLink.classList.add('active');
            }
            pageLink.innerHTML = `<a href="#" data-page="${i}">${i}</a>`;
            paginationControls.appendChild(pageLink);
          }

          const nextLink = document.createElement('li');
          nextLink.classList.add('page-item');
          if (currentPage === totalPages) {
            nextLink.classList.add('disabled');
          }
          nextLink.innerHTML = `<a href="#" data-page="${currentPage + 1}">Sonraki &raquo;</a>`;
          paginationControls.appendChild(nextLink);

          // Sayfalama linklerine tıklama olayını ekle
          paginationControls.addEventListener('click', function(event) {
            event.preventDefault();
            const targetPage = parseInt(event.target.dataset.page);
            if (!isNaN(targetPage) && targetPage > 0 && targetPage <= totalPages && targetPage !== currentPage) {
              currentPage = targetPage;
              displayPosts(currentPage);
              setupPagination(totalPages);
              window.scrollTo({ top: 0, behavior: 'smooth' }); // Sayfa başına kaydır
            }
          });
        }

        const totalPages = Math.ceil(blogPosts.length / postsPerPage);
        displayPosts(currentPage);
        setupPagination(totalPages);
      });
    </script>
  </body>
</html>
